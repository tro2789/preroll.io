<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none">
  <style>
    text { font-family: Inter, system-ui, sans-serif; fill: #e8e6f0; }
    .title { font-size: 14px; font-weight: 600; }
    .label { font-size: 11px; font-weight: 500; }
    .desc { font-size: 9px; fill: #a09cb0; }
    .step { font-size: 10px; fill: #c0b8d8; }
    .box { rx: 6; ry: 6; stroke-width: 1.5; }
    .flow-line { stroke-width: 1.5; marker-end: url(#arr); }
  </style>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#6b4a9e"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#1a1820"/>

  <!-- Title -->
  <text class="title" x="450" y="30" text-anchor="middle">Authentication Flows</text>

  <!-- === Flow 1: Team Member Auth === -->
  <rect class="box" x="30" y="60" width="400" height="170" fill="#221f2a" stroke="#3a3545"/>
  <text class="label" x="50" y="85">1. Team Member Authentication</text>
  <text class="desc" x="50" y="102">(Producers, admins, team members — /app/* routes)</text>

  <rect class="box" x="50" y="115" width="110" height="40" fill="#2a2635" stroke="#4a3f6b"/>
  <text class="step" x="105" y="139" text-anchor="middle">Email + Password</text>

  <path class="flow-line" d="M160 135 L185 135" stroke="#6b4a9e"/>

  <rect class="box" x="185" y="115" width="100" height="40" fill="#2a2635" stroke="#4a3f6b"/>
  <text class="step" x="235" y="139" text-anchor="middle">Supabase Auth</text>

  <path class="flow-line" d="M285 135 L310 135" stroke="#6b4a9e"/>

  <rect class="box" x="310" y="115" width="100" height="40" fill="#2a2635" stroke="#6b4a9e"/>
  <text class="step" x="360" y="139" text-anchor="middle">Session JWT</text>

  <text class="desc" x="50" y="175">Session → memberships table → org_id resolved</text>
  <text class="desc" x="50" y="192">RLS policies enforce data access via user_org_ids()</text>
  <text class="desc" x="50" y="209">Roles: owner > admin > member</text>

  <!-- === Flow 2: Client Portal Auth === -->
  <rect class="box" x="30" y="250" width="400" height="150" fill="#221f2a" stroke="#3a3545"/>
  <text class="label" x="50" y="275">2. Client Portal Authentication</text>
  <text class="desc" x="50" y="292">(Clients reviewing deliverables — /portal/* routes)</text>

  <rect class="box" x="50" y="305" width="90" height="40" fill="#2a2635" stroke="#4a3f6b"/>
  <text class="step" x="95" y="329" text-anchor="middle">Magic Link</text>

  <path class="flow-line" d="M140 325 L165 325" stroke="#6b4a9e"/>

  <rect class="box" x="165" y="305" width="100" height="40" fill="#2a2635" stroke="#4a3f6b"/>
  <text class="step" x="215" y="329" text-anchor="middle">Supabase Auth</text>

  <path class="flow-line" d="M265 325 L290 325" stroke="#6b4a9e"/>

  <rect class="box" x="290" y="305" width="120" height="40" fill="#2a2635" stroke="#6b4a9e"/>
  <text class="step" x="350" y="329" text-anchor="middle">client_user_id</text>

  <text class="desc" x="50" y="365">No org membership — auth matched via clients.client_user_id</text>
  <text class="desc" x="50" y="382">Can only see deliverables for their own shows</text>

  <!-- === Flow 3: API Key Auth === -->
  <rect class="box" x="470" y="60" width="400" height="150" fill="#221f2a" stroke="#3a3545"/>
  <text class="label" x="490" y="85">3. API Key Authentication</text>
  <text class="desc" x="490" y="102">(Scripts, MCP server, external tools — /api/v1/* routes)</text>

  <rect class="box" x="490" y="115" width="110" height="40" fill="#2a2635" stroke="#4a3f6b"/>
  <text class="step" x="545" y="133" text-anchor="middle">Bearer pr_...</text>
  <text class="step" x="545" y="146" text-anchor="middle">(Authorization)</text>

  <path class="flow-line" d="M600 135 L625 135" stroke="#6b4a9e"/>

  <rect class="box" x="625" y="115" width="100" height="40" fill="#2a2635" stroke="#4a3f6b"/>
  <text class="step" x="675" y="139" text-anchor="middle">SHA-256 hash</text>

  <path class="flow-line" d="M725 135 L750 135" stroke="#6b4a9e"/>

  <rect class="box" x="750" y="115" width="100" height="40" fill="#2a2635" stroke="#6b4a9e"/>
  <text class="step" x="800" y="139" text-anchor="middle">org_id resolved</text>

  <text class="desc" x="490" y="175">Key hashed with SHA-256, looked up in api_keys table</text>
  <text class="desc" x="490" y="192">Resolves org_id directly — no user session needed</text>

  <!-- === Flow 4: Integration OAuth === -->
  <rect class="box" x="470" y="250" width="400" height="170" fill="#221f2a" stroke="#3a3545"/>
  <text class="label" x="490" y="275">4. Integration OAuth2 Flow</text>
  <text class="desc" x="490" y="292">(Frame.io, Google Drive, Vimeo, YouTube)</text>

  <rect class="box" x="490" y="305" width="90" height="40" fill="#2a2635" stroke="#4a3f6b"/>
  <text class="step" x="535" y="329" text-anchor="middle">Connect</text>

  <path class="flow-line" d="M580 325 L605 325" stroke="#6b4a9e"/>

  <rect class="box" x="605" y="305" width="100" height="40" fill="#2a2635" stroke="#4a3f6b"/>
  <text class="step" x="655" y="329" text-anchor="middle">Provider OAuth</text>

  <path class="flow-line" d="M705 325 L730 325" stroke="#6b4a9e"/>

  <rect class="box" x="730" y="305" width="120" height="40" fill="#2a2635" stroke="#6b4a9e"/>
  <text class="step" x="790" y="329" text-anchor="middle">Encrypted token</text>

  <text class="desc" x="490" y="365">Tokens encrypted with INTEGRATION_ENCRYPTION_KEY</text>
  <text class="desc" x="490" y="382">Stored in user_integrations table (scoped to org)</text>
  <text class="desc" x="490" y="399">Auto-refresh on expiry via getValidToken()</text>

  <!-- Bottom note -->
  <rect class="box" x="200" y="440" width="500" height="45" fill="#2a2635" stroke="#4a3f6b"/>
  <text class="label" x="450" y="462" text-anchor="middle">Central helper: getAuthenticatedClient()</text>
  <text class="desc" x="450" y="478" text-anchor="middle">Returns { supabase, user, org, error } — used by all /api/* routes</text>
</svg>
