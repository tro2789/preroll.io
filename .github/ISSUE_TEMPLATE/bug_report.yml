name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I click Publish on an episode, it shows 'failed' with no error message."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "The episode should publish to Transistor.fm and show 'published' status."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to an episode with audio attached
        2. Click Publish to Transistor
        3. Fill in metadata and click Publish
        4. See error
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Hosted (preroll.io)
        - Self-hosted
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome 125, Safari 18, Firefox 130, etc."
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, error messages, console logs, or anything else that might help.
